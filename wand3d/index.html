<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LUMINA VITA — The Wand, in 3D</title>
<meta name="description" content="Procedurally modeled 3D product viewer — perfectly smooth lathe geometry, real metallic band, crisp logo. Orbit, zoom, pan." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Space Grotesk', 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #060304;
    color: #f2e9ec;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(225,55,80,.4); }

  #scene { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #scene.dragging { cursor: grabbing; }
  canvas { display: block; outline: none; }

  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(75% 65% at 50% 45%, transparent 52%, rgba(6,3,4,.75) 100%);
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 28px; z-index: 10;
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .brand { display: flex; flex-direction: column; gap: 3px; }
  .brand .name { font-weight: 500; letter-spacing: .45em; text-indent: .45em; font-size: 13px; }
  .brand .sub  { font-size: 9px; letter-spacing: .3em; text-indent: .3em; color: #a4848c; text-transform: uppercase; }

  .chip {
    border: 1px solid rgba(242,233,236,.16);
    background: rgba(20,10,13,.5);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #f2e9ec;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 11px; letter-spacing: .12em;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: border-color .35s ease, background .35s ease, transform .35s ease;
    font-family: inherit;
  }
  .chip:hover { border-color: rgba(242,233,236,.45); background: rgba(40,18,24,.6); transform: translateY(-1px); }
  .chip:active { transform: translateY(0) scale(.97); }

  .badge {
    position: fixed; top: 86px; left: 28px; z-index: 9;
    border: 1px solid rgba(242,233,236,.14);
    background: rgba(15,8,10,.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 10px; letter-spacing: .18em;
    color: #cbb3ba;
    pointer-events: none;
  }

  .controls {
    position: fixed; right: 22px; bottom: 22px; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
  }
  .controls button {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(242,233,236,.16);
    background: rgba(15,8,10,.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
    color: #f2e9ec;
    font-family: inherit;
    font-size: 16px; line-height: 1;
    cursor: pointer;
    transition: border-color .3s ease, background .3s ease, transform .3s ease;
  }
  .controls button:hover { border-color: rgba(242,233,236,.45); background: rgba(40,18,24,.65); transform: translateY(-1px); }
  .controls button:active { transform: scale(.94); }

  .hud {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 9;
    font-size: 10px; letter-spacing: .28em; text-indent: .28em;
    text-transform: uppercase; color: #a4848c;
    display: flex; align-items: center; gap: 12px;
    white-space: nowrap;
    pointer-events: none;
  }
  .hud svg { animation: sway 2.4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }

  #loader {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: #060304;
    transition: opacity .9s ease, visibility .9s;
  }
  #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
  #loader .mark {
    letter-spacing: .5em; text-indent: .5em;
    font-weight: 300; font-size: 15px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

  footer {
    position: fixed; bottom: 22px; left: 28px;
    font-size: 9px; letter-spacing: .3em; text-transform: uppercase;
    color: rgba(164,132,140,.55);
    pointer-events: none;
    z-index: 9;
  }

  @media (max-width: 560px) {
    header { padding: 16px 18px; }
    .badge { top: 76px; left: 18px; }
    footer { display: none; }
    .hud { bottom: 84px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hud svg, #loader .mark { animation: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="scene"></div>
<div class="vignette"></div>

<header>
  <div class="brand">
    <span class="name">LUMINA VITA</span>
    <span class="sub">Procedural 3D · The Wand</span>
  </div>
  <button class="chip" id="fs">
    <svg width="12" height="12" viewBox="0 0 13 13" fill="none">
      <path d="M1 4.5V1H4.5M8.5 1H12V4.5M12 8.5V12H8.5M4.5 12H1V8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span id="fs-label">Fullscreen</span>
  </button>
</header>

<span class="badge">full orbit · zoom · pan</span>

<div class="controls">
  <button id="c-in"  aria-label="Zoom in">+</button>
  <button id="c-out" aria-label="Zoom out">−</button>
  <button id="c-reset" aria-label="Reset view">⟲</button>
</div>

<div class="hud">
  <svg width="26" height="10" viewBox="0 0 26 10" fill="none">
    <path d="M1 5H25M1 5L4.5 1.5M1 5L4.5 8.5M25 5L21.5 1.5M25 5L21.5 8.5" stroke="#a4848c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Drag to orbit · scroll to zoom · right-drag to pan
</div>

<footer>The Wand — Crimson Edition</footer>

<div id="loader"><span class="mark">L U M I N A&nbsp;&nbsp;V I T A</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* silhouette traced from the product footage — [y, radius], y: 0 bottom → 1 top */
const PROFILE = [[0.0, 0.0607], [0.0112, 0.0726], [0.0225, 0.0902], [0.0337, 0.0965], [0.0449, 0.1021], [0.0562, 0.1057], [0.0674, 0.1094], [0.0787, 0.1118], [0.0899, 0.1138], [0.1011, 0.1147], [0.1124, 0.1155], [0.1236, 0.1166], [0.1348, 0.1173], [0.1461, 0.1173], [0.1573, 0.1173], [0.1685, 0.1173], [0.1798, 0.1173], [0.191, 0.1173], [0.2022, 0.1173], [0.2135, 0.1173], [0.2247, 0.1173], [0.236, 0.1173], [0.2472, 0.1173], [0.2584, 0.1173], [0.2697, 0.1173], [0.2809, 0.1173], [0.2921, 0.1173], [0.3034, 0.1173], [0.3146, 0.1173], [0.3258, 0.1173], [0.3371, 0.1173], [0.3483, 0.1173], [0.3596, 0.1173], [0.3708, 0.1173], [0.382, 0.1173], [0.3933, 0.1173], [0.4045, 0.1173], [0.4157, 0.1173], [0.427, 0.1173], [0.4382, 0.1173], [0.4494, 0.1173], [0.4607, 0.1173], [0.4719, 0.1173], [0.4831, 0.1173], [0.4944, 0.1167], [0.5056, 0.1159], [0.5169, 0.1147], [0.5281, 0.113], [0.5393, 0.1105], [0.5506, 0.1079], [0.5618, 0.1044], [0.573, 0.1011], [0.5843, 0.0978], [0.5955, 0.093], [0.6067, 0.0884], [0.618, 0.0815], [0.6292, 0.0759], [0.6404, 0.0699], [0.6517, 0.0663], [0.6629, 0.0623], [0.6742, 0.0598], [0.6854, 0.0588], [0.6966, 0.0584], [0.7079, 0.0589], [0.7191, 0.0614], [0.7303, 0.0652], [0.7416, 0.0756], [0.7528, 0.0875], [0.764, 0.1021], [0.7753, 0.1082], [0.7865, 0.1132], [0.7978, 0.1156], [0.809, 0.116], [0.8202, 0.116], [0.8315, 0.116], [0.8427, 0.116], [0.8539, 0.1158], [0.86, 0.116], [0.8661, 0.1158], [0.8722, 0.1155], [0.8782, 0.115], [0.8843, 0.1143], [0.8904, 0.1135], [0.8965, 0.1124], [0.9026, 0.1112], [0.9087, 0.1097], [0.9148, 0.108], [0.9209, 0.106], [0.9269, 0.1038], [0.933, 0.1012], [0.9391, 0.0983], [0.9452, 0.095], [0.9513, 0.0913], [0.9574, 0.087], [0.9635, 0.0822], [0.9696, 0.0766], [0.9757, 0.0701], [0.9817, 0.0623], [0.9878, 0.0524], [0.9939, 0.0387], [1.0, 0.0]];

const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMobile = window.matchMedia('(max-width: 640px)').matches;
const container = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060304);
scene.fog = new THREE.FogExp2(0x060304, 0.055);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ─── geometry: perfectly smooth lathe from the traced silhouette ─── */
const H = 2;                                   /* world height of the wand */
const rAt = (y) => {                           /* radius lookup at normalized height */
  for (let i = 1; i < PROFILE.length; i++) {
    if (PROFILE[i][0] >= y) {
      const [y0, r0] = PROFILE[i - 1], [y1, r1] = PROFILE[i];
      const t = (y - y0) / Math.max(y1 - y0, 1e-6);
      return r0 + (r1 - r0) * t;
    }
  }
  return PROFILE[PROFILE.length - 1][1];
};

const pts = [new THREE.Vector2(0.0001, 0)];
for (const [y, r] of PROFILE) pts.push(new THREE.Vector2(Math.max(r * H, 0.0001), y * H));
pts.push(new THREE.Vector2(0.0001, H));

const wand = new THREE.Group();
scene.add(wand);

const bodyMat = new THREE.MeshPhysicalMaterial({
  color: 0x6b1019,               /* deep matte crimson, darker like the shot */
  roughness: 0.58,
  metalness: 0.0,
  clearcoat: 0.22,
  clearcoatRoughness: 0.65,
  sheen: 0.35,
  sheenColor: 0xa02838,
  envMapIntensity: 0.4,
});
const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 128), bodyMat);
wand.add(body);

/* rose-gold band — real polished metal, sits proud of the body */
const BAND_LO = 0.148, BAND_HI = 0.176;
const bandPts = [];
for (let i = 0; i <= 12; i++) {
  const y = BAND_LO + (BAND_HI - BAND_LO) * (i / 12);
  /* slight barrel bulge so it catches highlights like the photo */
  const bulge = 1.018 + Math.sin((i / 12) * Math.PI) * 0.006;
  bandPts.push(new THREE.Vector2(rAt(y) * H * bulge, y * H));
}
const bandMat = new THREE.MeshPhysicalMaterial({
  color: 0xe6b287,
  metalness: 1.0,
  roughness: 0.12,
  envMapIntensity: 2.6,
  clearcoat: 0.6,
  clearcoatRoughness: 0.2,
  emissive: 0x4a2c14,
  emissiveIntensity: 0.55,
});
const band = new THREE.Mesh(new THREE.LatheGeometry(bandPts, 128), bandMat);
wand.add(band);

/* subtle seam ring where the neck meets the body */
const seamY = 0.585;
const seam = new THREE.Mesh(
  new THREE.TorusGeometry(rAt(seamY) * H * 1.0005, 0.0018, 8, 96),
  new THREE.MeshStandardMaterial({ color: 0x5e1019, roughness: 0.7 })
);
seam.rotation.x = Math.PI / 2;
seam.position.y = seamY * H;
wand.add(seam);

/* ─── logo: drawn as real text — crisp at any zoom ─── */
function makeLogoTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 1024;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 1024, 1024);
  const gold = '#f0cfa6';
  ctx.fillStyle = gold;
  ctx.strokeStyle = gold;
  ctx.textAlign = 'center';

  /* crest: circular emblem of two tapered feather strokes with a gap at the top,
     echoing the mark in the artwork */
  function taperedArc(cx, cy, r, a0, a1, wMax) {
    const steps = 40;
    for (let i = 0; i < steps; i++) {
      const t0 = i / steps, t1 = (i + 1) / steps;
      /* width swells in the middle of the stroke, tapers at the tips */
      const w = wMax * Math.sin(Math.PI * ((t0 + t1) / 2)) ** 0.6;
      ctx.lineWidth = Math.max(w, 1.5);
      ctx.beginPath();
      ctx.arc(cx, cy, r, a0 + (a1 - a0) * t0, a0 + (a1 - a0) * t1);
      ctx.stroke();
    }
  }
  ctx.save();
  ctx.translate(512, 356);
  ctx.lineCap = 'round';
  /* outer sweep — near-full circle opening at the top */
  taperedArc(0, 0, 62, Math.PI * -0.45, Math.PI * 1.42, 15);
  /* inner sweep — offset crescent inside */
  taperedArc(5, -5, 40, Math.PI * -0.2, Math.PI * 1.0, 10);
  ctx.restore();

  /* wordmark — compact lockup like the artwork */
  const serif = '"Cormorant Garamond", Georgia, "Times New Roman", serif';
  ctx.font = `600 138px ${serif}`;
  drawSpaced(ctx, 'LUMINA', 512, 580, 20);
  ctx.font = `500 74px ${serif}`;
  drawSpaced(ctx, 'VITA', 512, 682, 52);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function drawSpaced(ctx, text, cx, y, spacing) {
  const widths = [...text].map((ch) => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (text.length - 1);
  let x = cx - total / 2;
  [...text].forEach((ch, i) => {
    ctx.fillText(ch, x + widths[i] / 2, y);
    x += widths[i] + spacing;
  });
}

let logoMesh = null;
function buildLogo() {
  if (logoMesh) { wand.remove(logoMesh); logoMesh.geometry.dispose(); }
  const LOGO_MID = 0.275, LOGO_H = 0.22;       /* placement on the body — just above the band */
  const r = rAt(LOGO_MID) * H + 0.004;
  const arc = 0.9;                              /* radians of wrap */
  const geo = new THREE.CylinderGeometry(r, r, LOGO_H * H, 64, 1, true, -arc / 2, arc);
  const mat = new THREE.MeshStandardMaterial({
    map: makeLogoTexture(),
    transparent: true,
    roughness: 0.35,
    metalness: 0.65,
    envMapIntensity: 1.1,
    emissive: 0x63421f,
    emissiveMap: null,
    side: THREE.FrontSide,
    depthWrite: false,
  });
  logoMesh = new THREE.Mesh(geo, mat);
  logoMesh.position.y = LOGO_MID * H;           /* cylinder theta 0 faces +Z — the home camera */
  logoMesh.renderOrder = 2;                     /* above the floor-glow overlay */
  wand.add(logoMesh);
}
buildLogo();
/* redraw once the display serif arrives so the letterforms are exact */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildLogo);

/* ─── stage: glossy floor, mirrored reflection, red glow, smoke ─── */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color: 0x050203, roughness: 0.65, metalness: 0.1, transparent: true, opacity: 0.72, envMapIntensity: 0.08 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const mirror = wand.clone(true);
mirror.scale.y = -1;
mirror.traverse((o) => {
  if (o.isMesh) {
    o.material = o.material.clone();
    o.material.transparent = true;
    o.material.opacity = 0.45;      /* seen through the semi-opaque floor ≈ soft visible reflection */
    o.material.depthWrite = false;
  }
});
scene.add(mirror);

/* red radial glow behind the product (billboard) */
function radialTex(stops) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
  for (const [t, col] of stops) g.addColorStop(t, col);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);
  return new THREE.CanvasTexture(c);
}
const glowTex = radialTex([[0, 'rgba(255,60,60,.9)'], [0.35, 'rgba(190,25,40,.42)'], [1, 'rgba(190,25,40,0)']]);
const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, opacity: 0.9, depthWrite: false }));
glow.scale.set(7.2, 5.6, 1);
glow.position.set(0, 0.35, -2.6);       /* pooled low — the upper backdrop stays near-black */
scene.add(glow);

/* the glow's reflection in the floor — hides the hard horizon seam.
   depthTest off + low renderOrder: paints over the floor, then the wand
   (higher renderOrder) covers it, so it reads as light on the surface */
const glowRef = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, opacity: 0.3, depthWrite: false, depthTest: false }));
glowRef.scale.set(7.5, 4.2, 1);
glowRef.position.set(0, -1.4, -2.55);
glowRef.renderOrder = 1;
scene.add(glowRef);
wand.traverse((o) => { o.renderOrder = 2; });


const floorGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(16, 16),
  new THREE.MeshBasicMaterial({ map: radialTex([[0, 'rgba(235,65,85,.6)'], [0.45, 'rgba(160,28,42,.24)'], [1, 'rgba(160,28,42,0)']]), transparent: true, depthWrite: false })
);
floorGlow.rotation.x = -Math.PI / 2;
floorGlow.position.set(0, 0.004, -1.2);   /* pooled toward the backdrop so floor melts into the glow */
scene.add(floorGlow);

/* drifting smoke — soft blob sprites, slow parallax */
function smokeTex() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  for (let i = 0; i < 14; i++) {
    /* keep blobs well inside the canvas so the sprite edge never shows */
    const x = 78 + Math.random() * 100, y = 78 + Math.random() * 100, r = 24 + Math.random() * 42;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(220,120,120,.05)');
    g.addColorStop(1, 'rgba(220,120,120,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 256, 256);
  }
  return new THREE.CanvasTexture(c);
}
const smokes = [];
for (let i = 0; i < (isMobile ? 3 : 5); i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: smokeTex(), transparent: true, opacity: 0.8, depthWrite: false }));
  s.scale.setScalar(5 + Math.random() * 4);
  /* wisps hug the upper corners like the shot */
  s.position.set((i % 2 ? 1 : -1) * (2 + Math.random() * 2.2), 1.6 + Math.random() * 2.2, -1.5 - Math.random() * 2.5);
  s.userData = { r: Math.random() * Math.PI * 2, sp: 0.02 + Math.random() * 0.03 };
  scene.add(s);
  smokes.push(s);
}

/* dust */
const D = isMobile ? 140 : 320;
const dPos = new Float32Array(D * 3);
for (let i = 0; i < D; i++) {
  dPos[i * 3] = (Math.random() - 0.5) * 12;
  dPos[i * 3 + 1] = Math.random() * 5;
  dPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
}
const dGeo = new THREE.BufferGeometry();
dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
const dust = new THREE.Points(dGeo, new THREE.PointsMaterial({
  size: 0.03, map: radialTex([[0, 'rgba(255,190,190,1)'], [1, 'rgba(255,190,190,0)']]),
  color: 0xd98a95, transparent: true, opacity: 0.4,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(dust);

/* ─── lighting: crimson backlight, warm key, cool rim ─── */
scene.add(new THREE.AmbientLight(0x241014, 1.0));
const back = new THREE.PointLight(0xff2836, 70, 30);
back.position.set(0, 0.55, -2.2);       /* hot core low behind the base, like the shot */
scene.add(back);
const keyL = new THREE.DirectionalLight(0xffe6da, 0.7);
keyL.position.set(2.5, 5, 3.5);
scene.add(keyL);
const rim = new THREE.PointLight(0xff8f6b, 6, 16);
rim.position.set(-3, 2, 1.5);
scene.add(rim);
/* small warm glint so the metal band catches a crisp highlight */
const glint = new THREE.PointLight(0xfff2e0, 6, 5);
glint.position.set(0.9, 0.4, 1.7);
scene.add(glint);

/* ─── controls — full orbit, zoom, pan ─── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minPolarAngle = 0.05;
controls.maxPolarAngle = Math.PI * 0.55;      /* keep the camera above the glossy floor */
controls.minDistance = 1.1;
controls.maxDistance = 9;
controls.autoRotate = !prefersReduced;
controls.autoRotateSpeed = 1.7;

/* low camera like the photograph — the surface line falls near the base */
const homeTarget = new THREE.Vector3(0, 1.02, 0);
const homePos = new THREE.Vector3(0.3, 0.62, 3.0);

let idleTimer = null;
controls.addEventListener('start', () => {
  container.classList.add('dragging');
  controls.autoRotate = false;
  clearTimeout(idleTimer);
});
controls.addEventListener('end', () => {
  container.classList.remove('dragging');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!prefersReduced) controls.autoRotate = true; }, 3200);
});

function resetView(instant) {
  if (instant) {
    camera.position.copy(homePos);
    controls.target.copy(homeTarget);
    controls.update();
    return;
  }
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const start = performance.now(), DURMS = 700;
  (function step() {
    const k = Math.min((performance.now() - start) / DURMS, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(p0, homePos, e);
    controls.target.lerpVectors(t0, homeTarget, e);
    controls.update();
    if (k < 1) requestAnimationFrame(step);
  })();
}
resetView(true);

function dolly(f) {
  const dir = camera.position.clone().sub(controls.target);
  const len = THREE.MathUtils.clamp(dir.length() * f, controls.minDistance, controls.maxDistance);
  camera.position.copy(controls.target).add(dir.normalize().multiplyScalar(len));
  controls.update();
}
document.getElementById('c-in').addEventListener('click', () => dolly(0.78));
document.getElementById('c-out').addEventListener('click', () => dolly(1.28));
document.getElementById('c-reset').addEventListener('click', () => resetView(false));
renderer.domElement.addEventListener('dblclick', () => resetView(false));

const fsBtn = document.getElementById('fs');
const fsLabel = document.getElementById('fs-label');
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
});
document.addEventListener('fullscreenchange', () => {
  fsLabel.textContent = document.fullscreenElement ? 'Exit' : 'Fullscreen';
});

/* ─── loop ─── */
const clock = new THREE.Clock();
(function tick() {
  requestAnimationFrame(tick);
  if (document.hidden) return;
  const t = clock.getElapsedTime();
  dust.rotation.y = t * 0.018;
  glow.material.opacity = 0.75 + Math.sin(t * 1.3) * 0.12;
  for (const s of smokes) {
    s.material.rotation = s.userData.r + t * s.userData.sp;
    s.position.x += Math.sin(t * 0.1 + s.userData.r) * 0.0012;
  }
  controls.update();
  renderer.render(scene, camera);
})();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('loader').classList.add('done'), 400);
});
setTimeout(() => document.getElementById('loader').classList.add('done'), 3000);
</script>
</body>
