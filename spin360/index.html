<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LUMINA VITA — 360° Viewer</title>
<meta name="description" content="Interactive 360° product viewer. Drag to rotate." />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Space Grotesk', 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #080507;
    color: #f2e9ec;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  ::selection { background: rgba(225,55,80,.4); }

  /* ambient background glow to blend with the footage */
  .bg-glow {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(55% 45% at 50% 62%, rgba(190,30,45,.16), transparent 70%),
      radial-gradient(80% 70% at 50% 110%, rgba(120,10,25,.18), transparent 70%);
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 28px; z-index: 10;
  }
  .brand { display: flex; flex-direction: column; gap: 3px; }
  .brand .name { font-weight: 500; letter-spacing: .45em; text-indent: .45em; font-size: 13px; }
  .brand .sub  { font-size: 9px; letter-spacing: .3em; text-indent: .3em; color: #a4848c; text-transform: uppercase; }

  .chip {
    border: 1px solid rgba(242,233,236,.16);
    background: rgba(20,10,13,.5);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #f2e9ec;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 11px; letter-spacing: .12em;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: border-color .35s ease, background .35s ease, transform .35s ease;
    font-family: inherit;
  }
  .chip:hover { border-color: rgba(242,233,236,.45); background: rgba(40,18,24,.6); transform: translateY(-1px); }
  .chip:active { transform: translateY(0) scale(.97); }

  /* ---------- viewer ---------- */
  .stage {
    position: relative;
    width: min(86vmin, 640px);
    aspect-ratio: 1;
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
      0 40px 120px -30px rgba(160,20,35,.35),
      0 0 0 1px rgba(242,233,236,.07);
    touch-action: pan-y;
    cursor: grab;
    background: #0b0608;
  }
  .stage.dragging { cursor: grabbing; }
  .stage canvas { width: 100%; height: 100%; display: block; }

  /* soft edge fade so the square frame melts into the page */
  .stage::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 90px 20px rgba(8,5,7,.85);
    border-radius: 24px;
  }

  .loading {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: #0b0608;
    font-size: 10px; letter-spacing: .4em; text-indent: .4em;
    color: #a4848c; text-transform: uppercase;
    transition: opacity .8s ease, visibility .8s;
  }
  .loading.done { opacity: 0; visibility: hidden; }
  .loading span { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

  /* 360 badge */
  .badge {
    position: absolute; top: 14px; left: 14px; z-index: 4;
    border: 1px solid rgba(242,233,236,.14);
    background: rgba(15,8,10,.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 10px; letter-spacing: .18em;
    color: #cbb3ba;
    pointer-events: none;
  }

  /* ---------- readout ---------- */
  .console {
    margin-top: 26px;
    width: min(86vmin, 640px);
    display: flex; align-items: center; gap: 18px;
    z-index: 2;
  }
  .deg {
    font-variant-numeric: tabular-nums;
    font-size: 13px; letter-spacing: .1em;
    color: #cbb3ba; min-width: 52px;
  }
  .track {
    flex: 1; height: 2px; border-radius: 2px;
    background: rgba(242,233,236,.1);
    position: relative; overflow: visible;
  }
  .track .fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, #e13750, #ff8f6b);
    border-radius: 2px;
    width: 0%;
  }
  .track .knob {
    position: absolute; top: 50%; width: 9px; height: 9px;
    margin: -4.5px 0 0 -4.5px; border-radius: 50%;
    background: #f2e9ec;
    box-shadow: 0 0 12px 2px rgba(225,55,80,.8);
    left: 0%;
  }
  .hint {
    font-size: 10px; letter-spacing: .28em; text-indent: .28em;
    text-transform: uppercase; color: #a4848c;
    display: flex; align-items: center; gap: 10px;
    white-space: nowrap;
  }
  .hint svg { animation: sway 2.4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }

  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 20px 28px;
    font-size: 9px; letter-spacing: .3em; text-transform: uppercase;
    color: rgba(164,132,140,.55);
    pointer-events: none;
  }

  @media (max-width: 560px) {
    header { padding: 16px 18px; }
    .console { flex-wrap: wrap; gap: 12px; }
    .hint { order: 3; width: 100%; justify-content: center; }
    footer { justify-content: center; }
    footer .right { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hint svg, .loading span { animation: none; }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<header>
  <div class="brand">
    <span class="name">LUMINA VITA</span>
    <span class="sub">Interactive 360°</span>
  </div>
  <button class="chip" id="fs">
    <svg width="12" height="12" viewBox="0 0 13 13" fill="none">
      <path d="M1 4.5V1H4.5M8.5 1H12V4.5M12 8.5V12H8.5M4.5 12H1V8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span id="fs-label">Fullscreen</span>
  </button>
</header>

<div class="stage" id="stage">
  <span class="badge">360° · drag to rotate</span>
  <canvas id="view"></canvas>
  <div class="loading" id="loading"><span>Loading 360°</span></div>
</div>

<div class="console">
  <span class="deg" id="deg">0°</span>
  <div class="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
  <span class="hint">
    <svg width="26" height="10" viewBox="0 0 26 10" fill="none">
      <path d="M1 5H25M1 5L4.5 1.5M1 5L4.5 8.5M25 5L21.5 1.5M25 5L21.5 8.5" stroke="#a4848c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Drag · Spin · Release
  </span>
</div>

<footer>
  <span>The Wand — Crimson Edition</span>
  <span class="right">72 frames · full revolution</span>
</footer>

<script>
(function () {
  'use strict';

  var COLS = 9, ROWS = 8, N = 72, CELL = 512;
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stage   = document.getElementById('stage');
  var canvas  = document.getElementById('view');
  var ctx     = canvas.getContext('2d');
  var loading = document.getElementById('loading');
  var degEl   = document.getElementById('deg');
  var fillEl  = document.getElementById('fill');
  var knobEl  = document.getElementById('knob');

  canvas.width = CELL;
  canvas.height = CELL;

  var sprite = new Image();
  var ready = false;

  /* rotation state — `frame` is a float, wraps modulo N */
  var frame = 0;
  var velocity = 0;
  var dragging = false;
  var lastX = 0;
  var lastT = 0;
  var lastInteraction = 0;
  var lastDrawn = -1;

  var AUTO_SPEED = 0.045;       /* frames per tick when idling */
  var IDLE_DELAY = 2600;        /* ms before auto-spin resumes */
  var FRICTION = 0.94;

  function mod(n, m) { return ((n % m) + m) % m; }

  function draw() {
    var i = mod(Math.round(frame), N);
    if (i === lastDrawn) return;
    lastDrawn = i;
    var sx = (i % COLS) * CELL;
    var sy = Math.floor(i / COLS) * CELL;
    ctx.drawImage(sprite, sx, sy, CELL, CELL, 0, 0, CELL, CELL);

    var deg = Math.round(i / N * 360);
    degEl.textContent = deg + '°';
    var pct = (i / N * 100).toFixed(1) + '%';
    fillEl.style.width = pct;
    knobEl.style.left = pct;
  }

  function tick(now) {
    requestAnimationFrame(tick);
    if (!ready || document.hidden) return;

    if (!dragging) {
      if (Math.abs(velocity) > 0.002) {
        frame += velocity;
        velocity *= FRICTION;
      } else if (!prefersReduced && now - lastInteraction > IDLE_DELAY) {
        frame += AUTO_SPEED;
      }
    }
    draw();
  }
  requestAnimationFrame(tick);

  /* ---------- pointer interaction ---------- */
  stage.addEventListener('pointerdown', function (e) {
    if (!ready) return;
    dragging = true;
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
    lastX = e.clientX;
    lastT = performance.now();
    velocity = 0;
    lastInteraction = performance.now();
  });

  stage.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX;
    var dt = Math.max(performance.now() - lastT, 1);
    lastX = e.clientX;
    lastT = performance.now();
    lastInteraction = performance.now();

    var rect = stage.getBoundingClientRect();
    var delta = dx / rect.width * N * 1.15;  /* one full drag ≈ one revolution */
    frame += delta;
    velocity = delta * (16 / dt);            /* normalise to ~per-frame speed */
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove('dragging');
    lastInteraction = performance.now();
    velocity = Math.max(-2.5, Math.min(2.5, velocity));
  }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  /* keyboard access */
  stage.tabIndex = 0;
  stage.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')  { frame -= 1; lastInteraction = performance.now(); }
    if (e.key === 'ArrowRight') { frame += 1; lastInteraction = performance.now(); }
  });

  /* ---------- fullscreen ---------- */
  var fsBtn = document.getElementById('fs');
  var fsLabel = document.getElementById('fs-label');
  fsBtn.addEventListener('click', function () {
    if (!document.fullscreenElement) {
      (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  });
  document.addEventListener('fullscreenchange', function () {
    fsLabel.textContent = document.fullscreenElement ? 'Exit' : 'Fullscreen';
  });

  /* ---------- sprite load ---------- */
  sprite.onload = function () {
    ready = true;
    lastInteraction = performance.now() - IDLE_DELAY + 900; /* start auto-spin shortly after load */
    draw();
    loading.classList.add('done');
  };
