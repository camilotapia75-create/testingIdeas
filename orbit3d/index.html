<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LUMINA VITA — True 3D Orbit</title>
<meta name="description" content="Real-time 3D product viewer — orbit, zoom, and pan around a reconstructed mesh." />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Space Grotesk', 'Inter', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #080507;
    color: #f2e9ec;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(225,55,80,.4); }

  #scene { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #scene.dragging { cursor: grabbing; }
  canvas { display: block; outline: none; }

  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(70% 60% at 50% 45%, transparent 55%, rgba(8,5,7,.7) 100%),
      radial-gradient(55% 45% at 50% 68%, rgba(190,30,45,.10), transparent 70%);
  }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 28px; z-index: 10;
    pointer-events: none;
  }
  header > * { pointer-events: auto; }
  .brand { display: flex; flex-direction: column; gap: 3px; }
  .brand .name { font-weight: 500; letter-spacing: .45em; text-indent: .45em; font-size: 13px; }
  .brand .sub  { font-size: 9px; letter-spacing: .3em; text-indent: .3em; color: #a4848c; text-transform: uppercase; }

  .chip {
    border: 1px solid rgba(242,233,236,.16);
    background: rgba(20,10,13,.5);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    color: #f2e9ec;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 11px; letter-spacing: .12em;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: border-color .35s ease, background .35s ease, transform .35s ease, opacity .35s ease;
    font-family: inherit;
  }
  .chip:hover { border-color: rgba(242,233,236,.45); background: rgba(40,18,24,.6); transform: translateY(-1px); }
  .chip:active { transform: translateY(0) scale(.97); }

  .badge {
    position: fixed; top: 86px; left: 28px; z-index: 9;
    border: 1px solid rgba(242,233,236,.14);
    background: rgba(15,8,10,.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 10px; letter-spacing: .18em;
    color: #cbb3ba;
    pointer-events: none;
  }

  .controls {
    position: fixed; right: 22px; bottom: 22px; z-index: 10;
    display: flex; flex-direction: column; gap: 8px;
  }
  .controls button {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(242,233,236,.16);
    background: rgba(15,8,10,.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
    color: #f2e9ec;
    font-family: inherit;
    font-size: 16px; line-height: 1;
    cursor: pointer;
    transition: border-color .3s ease, background .3s ease, transform .3s ease;
  }
  .controls button:hover { border-color: rgba(242,233,236,.45); background: rgba(40,18,24,.65); transform: translateY(-1px); }
  .controls button:active { transform: scale(.94); }

  .hud {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    z-index: 9;
    font-size: 10px; letter-spacing: .28em; text-indent: .28em;
    text-transform: uppercase; color: #a4848c;
    display: flex; align-items: center; gap: 12px;
    white-space: nowrap;
    pointer-events: none;
  }
  .hud svg { animation: sway 2.4s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }

  #loader {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #080507;
    transition: opacity .9s ease, visibility .9s;
  }
  #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
  #loader .mark {
    letter-spacing: .5em; text-indent: .5em;
    font-weight: 300; font-size: 15px;
    animation: pulse 2s ease-in-out infinite;
  }
  #loader .pct { font-size: 10px; letter-spacing: .3em; color: #a4848c; }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

  footer {
    position: fixed; bottom: 22px; left: 28px;
    font-size: 9px; letter-spacing: .3em; text-transform: uppercase;
    color: rgba(164,132,140,.55);
    pointer-events: none;
    z-index: 9;
  }

  @media (max-width: 560px) {
    header { padding: 16px 18px; }
    .badge { top: 76px; left: 18px; }
    footer { display: none; }
    .hud { bottom: 84px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hud svg, #loader .mark { animation: none; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="scene"></div>
<div class="vignette"></div>

<header>
  <div class="brand">
    <span class="name">LUMINA VITA</span>
    <span class="sub">True 3D · Reconstructed Mesh</span>
  </div>
  <button class="chip" id="fs">
    <svg width="12" height="12" viewBox="0 0 13 13" fill="none">
      <path d="M1 4.5V1H4.5M8.5 1H12V4.5M12 8.5V12H8.5M4.5 12H1V8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span id="fs-label">Fullscreen</span>
  </button>
</header>

<span class="badge">full orbit · zoom · pan</span>

<div class="controls">
  <button id="c-in"  aria-label="Zoom in">+</button>
  <button id="c-out" aria-label="Zoom out">−</button>
  <button id="c-reset" aria-label="Reset view">⟲</button>
</div>

<div class="hud">
  <svg width="26" height="10" viewBox="0 0 26 10" fill="none">
    <path d="M1 5H25M1 5L4.5 1.5M1 5L4.5 8.5M25 5L21.5 1.5M25 5L21.5 8.5" stroke="#a4848c" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  Drag to orbit · scroll to zoom · right-drag to pan
</div>

<footer>The Wand — Crimson Edition · generated mesh</footer>

<div id="loader">
  <span class="mark">L U M I N A&nbsp;&nbsp;V I T A</span>
  <span class="pct" id="pct">Loading mesh — 0%</span>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const GLB_SRC = 'https://d3u0tzju9qaucj.cloudfront.net/7d051b5a-7bfe-49fe-a484-24e7b3a9458a/920b3887-4940-4a9e-9f0a-6cb1e08baca3.glb';

const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const container = document.getElementById('scene');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080507);
scene.fog = new THREE.FogExp2(0x080507, 0.045);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 100);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* — cinematic lighting to match the footage: white key, crimson glow — */
scene.add(new THREE.AmbientLight(0x2a1216, 1.6));
const key = new THREE.DirectionalLight(0xfff0ea, 2.0);
key.position.set(3, 6, 4);
scene.add(key);
const crimson = new THREE.PointLight(0xe13750, 40, 30);
crimson.position.set(0, 1.2, -3.2);
scene.add(crimson);
const warm = new THREE.PointLight(0xff8f6b, 12, 20);
warm.position.set(-3.5, 2.5, 2.5);
scene.add(warm);

/* — floor: soft red glow disc + faint grid — */
const glowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(225,55,80,.55)');
  g.addColorStop(0.5, 'rgba(150,25,40,.22)');
  g.addColorStop(1, 'rgba(150,25,40,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const glow = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 8),
  new THREE.MeshBasicMaterial({ map: glowTex, transparent: true, depthWrite: false })
);
glow.rotation.x = -Math.PI / 2;
glow.position.y = 0.002;
scene.add(glow);

const grid = new THREE.GridHelper(30, 40, 0x3a1620, 0x180a0e);
grid.material.transparent = true;
grid.material.opacity = 0.55;
scene.add(grid);

/* — dust — */
const D = window.matchMedia('(max-width: 640px)').matches ? 160 : 380;
const dPos = new Float32Array(D * 3);
for (let i = 0; i < D; i++) {
  dPos[i * 3] = (Math.random() - 0.5) * 14;
  dPos[i * 3 + 1] = Math.random() * 6;
  dPos[i * 3 + 2] = (Math.random() - 0.5) * 14;
}
const dGeo = new THREE.BufferGeometry();
dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
const dustTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, 'rgba(255,190,190,1)');
  g.addColorStop(1, 'rgba(255,190,190,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
})();
const dust = new THREE.Points(dGeo, new THREE.PointsMaterial({
  size: 0.035, map: dustTex, color: 0xd98a95,
  transparent: true, opacity: 0.45,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(dust);

/* — controls: the real thing — orbit all the way around, zoom, pan — */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minPolarAngle = 0.05;
controls.maxPolarAngle = Math.PI * 0.92;
controls.autoRotate = !prefersReduced;
controls.autoRotateSpeed = 0.9;

let idleTimer = null;
controls.addEventListener('start', () => {
  container.classList.add('dragging');
  controls.autoRotate = false;
  clearTimeout(idleTimer);
});
controls.addEventListener('end', () => {
  container.classList.remove('dragging');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (!prefersReduced) controls.autoRotate = true; }, 3200);
});

/* — model — */
const pctEl = document.getElementById('pct');
let homePos = new THREE.Vector3(0, 1.1, 3.2);
let homeTarget = new THREE.Vector3(0, 0.8, 0);

new GLTFLoader().load(
  GLB_SRC,
  (gltf) => {
    const model = gltf.scene;

    /* normalise: longest dimension ≈ 2 units, centered, feet on floor */
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z, 0.0001);
    model.scale.setScalar(2 / maxDim);

    const box2 = new THREE.Box3().setFromObject(model);
    const center2 = box2.getCenter(new THREE.Vector3());
    const size2 = box2.getSize(new THREE.Vector3());
    model.position.sub(center2);
    model.position.y += size2.y / 2;   /* feet on the grid */

    model.traverse((o) => {
      if (o.isMesh && o.material) {
        o.material.envMapIntensity = 1.1;
        if ('roughness' in o.material) o.material.roughness = Math.min(o.material.roughness ?? 0.5, 0.65);
      }
    });
    scene.add(model);

    /* frame the camera from the bounding sphere so any mesh fits */
    const sphere = new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());
    const dist = (sphere.radius / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * 1.35;
    homeTarget = sphere.center.clone();
    homePos = new THREE.Vector3(dist * 0.15, sphere.center.y + dist * 0.12, dist);
    controls.minDistance = sphere.radius * 0.6;
    controls.maxDistance = dist * 4;
    resetView(true);
    document.getElementById('loader').classList.add('done');
  },
  (ev) => {
    if (ev.total) pctEl.textContent = 'Loading mesh — ' + Math.round(ev.loaded / ev.total * 100) + '%';
    else pctEl.textContent = 'Loading mesh…';
  },
  (err) => {
    pctEl.textContent = 'Could not load the mesh — check your connection';
    console.error(err);
  }
);

function resetView(instant) {
  if (instant) {
    camera.position.copy(homePos);
    controls.target.copy(homeTarget);
    controls.update();
    return;
  }
  /* eased glide back home */
  const p0 = camera.position.clone(), t0 = controls.target.clone();
  const start = performance.now(), DURMS = 700;
  (function step() {
    const k = Math.min((performance.now() - start) / DURMS, 1);
    const e = 1 - Math.pow(1 - k, 3);
    camera.position.lerpVectors(p0, homePos, e);
    controls.target.lerpVectors(t0, homeTarget, e);
    controls.update();
    if (k < 1) requestAnimationFrame(step);
  })();
}

/* — buttons — */
function dolly(f) {
  const dir = camera.position.clone().sub(controls.target);
  const len = THREE.MathUtils.clamp(dir.length() * f, controls.minDistance, controls.maxDistance);
  camera.position.copy(controls.target).add(dir.normalize().multiplyScalar(len));
  controls.update();
}
document.getElementById('c-in').addEventListener('click', () => dolly(0.78));
document.getElementById('c-out').addEventListener('click', () => dolly(1.28));
document.getElementById('c-reset').addEventListener('click', () => resetView(false));
renderer.domElement.addEventListener('dblclick', () => resetView(false));

const fsBtn = document.getElementById('fs');
const fsLabel = document.getElementById('fs-label');
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
});
document.addEventListener('fullscreenchange', () => {
  fsLabel.textContent = document.fullscreenElement ? 'Exit' : 'Fullscreen';
});

/* — loop — */
const clock = new THREE.Clock();
(function tick() {
  requestAnimationFrame(tick);
  if (document.hidden) return;
  const t = clock.getElapsedTime();
  dust.rotation.y = t * 0.02;
  glow.material.opacity = 0.85 + Math.sin(t * 1.4) * 0.15;
  controls.update();
  renderer.render(scene, camera);
})();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
