name: Nightly Video Ad Generation

on:
  # PAUSED -- uncomment the schedule line below once YouTube auth secrets are set.
  # Time is chosen for peak US engagement: 23:00 UTC = 7pm ET / 4pm PT,
  # so videos are fresh when the 18-35 crowd is scrolling after work/school.
  # schedule:
  #   - cron: '0 23 * * *'
  workflow_dispatch:  # Manual trigger only for now

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic fal-client google-api-python-client google-auth-oauthlib

      - name: Generate videos and post to YouTube Shorts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python generate_video_ads.py

      - name: Commit results
        run: |
          git config user.name "Ad Agent"
          git config user.email "ad-agent@noreply.github.com"
          git pull --rebase origin main
          git add ads/ youtube_log.json
          git diff --cached --quiet || git commit -m "chore: video ads posted $(date -u +%Y-%m-%d)"
          git push -u origin main
