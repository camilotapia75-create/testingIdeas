name: Track YouTube Engagement

on:
  schedule:
    - cron: '0 6 * * *'  # 6am UTC daily -- scores videos posted 48+ hrs ago
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth-oauthlib

      - name: Fetch metrics and score videos
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python track_engagement.py

      - name: Commit updated scores
        run: |
          git config user.name "Ad Agent"
          git config user.email "ad-agent@noreply.github.com"
          git pull --rebase origin main
          git add youtube_log.json performance.json
          git diff --cached --quiet || git commit -m "chore: engagement scores updated $(date -u +%Y-%m-%d)"
          git push -u origin main
